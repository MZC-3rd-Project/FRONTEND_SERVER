name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      TF_VAR_s3_bucket_name: ${{ vars.S3_BUCKET_NAME }}
      TF_VAR_environment: dev
      TF_VAR_project_name: 3rd-project-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cf_url=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ steps.tf_outputs.outputs.s3_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Sync assets to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.tf_outputs.outputs.s3_bucket }}/ \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cf_distribution_id }} \
            --paths "/*"

      - name: Print deployment URL
        run: echo "배포 완료 → ${{ steps.tf_outputs.outputs.cf_url }}"
